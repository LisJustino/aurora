<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Personalize aparência, áreas e dados locais do Aurora.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aurora">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <meta name="aurora-route" content="config">
  <title>Ajustes | aurora.</title>
  <script src="%BASE_URL%loading-appearance.js"></script>
  <link rel="stylesheet" href="../src/css/main.css">
</head>
<body>
  <div id="app"><main class="account-loading" role="status" aria-busy="true">
    <div class="account-loading-content">
      <header class="account-loading-header">
        <span class="account-loading-brand" aria-hidden="true"><img src="%BASE_URL%icons/favicon.svg" alt="" width="36" height="36"><span class="wordmark">aurora.</span></span>
        <span class="account-loading-status"><span class="account-loading-indicator" aria-hidden="true"></span><span class="account-loading-message">Preparando seu espa&#231;o&#8230;</span></span>
      </header>
      <div class="account-loading-skeleton" aria-hidden="true">
        <div class="loading-skeleton-hero"><span class="loading-skeleton-line short"></span><span class="loading-skeleton-line title"></span><span class="loading-skeleton-line medium"></span><span class="loading-skeleton-button"></span></div>
        <div class="loading-skeleton-dashboard"><div class="loading-skeleton-card"><span class="loading-skeleton-line medium"></span><span class="loading-skeleton-line short"></span><span class="loading-skeleton-field"></span></div><div class="loading-skeleton-card"><span class="loading-skeleton-line short"></span><span class="loading-skeleton-line medium"></span></div></div>
      </div>
    </div>
  </main></div>
  <noscript>O Aurora precisa de JavaScript para autenticar sua conta e salvar seus dados com segurança.</noscript>
  <script type="module" src="../src/js/main.js"></script>
</body>
</html>
