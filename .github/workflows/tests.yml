name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run lint
      - name: Run application tests
        run: npm test
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.45.5
      - name: Start isolated Supabase database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations to isolated database
        run: supabase db reset --local
      - name: Run relational RLS integration checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          PGPASSWORD=postgres psql --host=127.0.0.1 --port=54322 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --file=supabase/schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set=ON_ERROR_STOP=1 --file=supabase/tests/rls_isolation.sql
      - name: Verify concurrent relational writes
        run: npm run test:supabase:concurrency
      - name: Build Cloudflare Pages assets
        run: npm run build
      - name: Check SEO metadata and public assets
        run: npm run test:seo
      - name: Install browsers for regression matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser smoke tests
        env:
          RUN_BROWSER_MATRIX: '1'
        run: npm run test:e2e:ci
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Run worker tests
        working-directory: worker
        run: npm test
