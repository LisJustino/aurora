<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="robots" content="noindex">
  <meta name="description" content="Esta página do Aurora não foi encontrada.">
  <meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/favicon-512.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f0ea;
      --surface: #fffdfa;
      --surface-strong: #fcf8f5;
      --ink: #252321;
      --muted: #625f5b;
      --line: rgb(91 81 73 / 14%);
      --accent: #8d4665;
      --btn: #8d4665;
      --on-btn: #fff;
      --focus: #68423e;
      --font: "DM Sans", "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1c1b19;
        --surface: #272522;
        --surface-strong: #272522;
        --ink: #f2efeb;
        --muted: #c8c2bb;
        --line: rgb(205 196 186 / 17%);
        --accent: color-mix(in srgb, #d991aa 72%, #fff);
        --focus: #edc6bc;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 1rem/1.5 var(--font);
      letter-spacing: -.008em;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .public-error {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      grid-template-rows: auto 1fr;
      gap: 48px;
      width: min(100%, 1200px);
      margin-inline: auto;
      padding: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 8px;
      color: var(--ink);
      font-size: 1.375rem;
      font-weight: 700;
      text-decoration: none;
    }
    .brand img { width: 36px; height: 36px; }
    .wordmark i, h1 i { color: var(--accent); font-style: normal; }
    .public-error-card {
      display: grid;
      width: min(100%, 560px);
      justify-self: center;
      align-self: center;
      justify-items: center;
      align-content: center;
      gap: 16px;
      padding: clamp(24px, 7vw, 48px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface-strong);
      box-shadow: 0 10px 24px -20px rgb(74 37 52 / 36%), 0 1px 3px rgb(74 37 52 / 7%);
      text-align: center;
    }
    .public-error-code {
      color: var(--accent);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.2;
      text-wrap: balance;
    }
    p { max-width: 42ch; margin: 0; color: var(--muted); line-height: 1.6; }
    .action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      padding: 0 20px;
      border: 1px solid var(--btn);
      border-radius: 12px;
      background: var(--btn);
      color: var(--on-btn);
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .public-error { padding: 16px; }
      .action { width: 100%; }
    }
  </style>
  <title>Página não encontrada | aurora.</title>
</head>
<body>
  <main class="public-error" aria-labelledby="not-found-title">
    <a class="brand" href="/" aria-label="aurora., página inicial">
      <img src="/icons/favicon.svg" alt="" width="36" height="36">
      <span class="wordmark">aurora<i>.</i></span>
    </a>
    <section class="public-error-card">
      <span class="public-error-code" aria-hidden="true">404</span>
      <h1 id="not-found-title">Esta página não existe<i>.</i></h1>
      <p>Confira se o endereço está correto ou volte à página inicial.</p>
      <a class="action" href="/">Voltar ao Aurora</a>
    </section>
  </main>
</body>
</html>
