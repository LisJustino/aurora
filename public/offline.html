<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1b19">
  <meta name="robots" content="noindex">
  <title>Sem conexão | aurora.</title>
  <style>
    :root { color-scheme: light dark; font-family: "DM Sans", system-ui, sans-serif; background: #1c1b19; color: #f5f2ee; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; place-items: center; }
    main { width: min(100%, 520px); padding: clamp(24px, 7vw, 48px); border: 1px solid #62504c; border-radius: 24px; background: #2a2523; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: #f5f2ee; font-size: 1.25rem; font-weight: 700; text-decoration: none; }
    .brand-mark { display: grid; width: 36px; height: 36px; border-radius: 12px; background: #c8a19e; color: #1c1b19; place-items: center; }
    h1 { margin: 40px 0 12px; font-size: clamp(1.75rem, 7vw, 2.5rem); line-height: 1.1; }
    p { color: #c9c1bb; line-height: 1.6; }
    a.action { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 16px; padding: 0 20px; border-radius: 12px; background: #c8a19e; color: #1c1b19; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f1c8d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="aurora., página inicial">
      <span class="brand-mark" aria-hidden="true">a.</span>
      <span>aurora.</span>
    </a>
    <h1>Você está sem conexão<i>.</i></h1>
    <p>O Aurora precisa da internet para entrar na conta e sincronizar seus dados. Confira sua conexão e tente novamente; alterações offline não serão salvas.</p>
    <a class="action" href="/">Tentar novamente</a>
  </main>
</body>
</html>
